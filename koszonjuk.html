<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>D-Ticket | Bejelentés elküldve</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #18212b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      text-align: center;
    }

    .brand {
      margin-bottom: 24px;
    }

    .brand-name {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -1px;
      color: #111827;
    }

    .brand-name span {
      color: #2563eb;
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 42px 28px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
    }

    .check {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #ecfdf3;
      color: #16a34a;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 22px;
      font-size: 36px;
      font-weight: bold;
    }

    h1 {
      font-size: 25px;
      margin-bottom: 12px;
    }

    p {
      color: #6b7280;
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .new-ticket {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 54px;
      border-radius: 12px;
      background: #111827;
      color: #ffffff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      transition: 0.2s;
    }

    .new-ticket:hover {
      background: #2563eb;
    }

    @media (max-width: 520px) {
      .card {
        padding: 36px 20px;
      }

      .brand-name {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="brand">
      <div class="brand-name">D<span>-</span>Ticket</div>
    </div>

    <section class="card">

      <div class="check">✓</div>

      <h1>Köszönjük!</h1>

      <p>
        A bejelentést sikeresen rögzítettük.
      </p>

      <a href="/" class="new-ticket">
        Új bejelentés
      </a>

    </section>

  </main>

</body>
</html>
